[package]
name = "vocalolyrics"
version = "0.2.2"
edition = "2024"
license = "GPL-3.0"
description = """Lyrics scraper, primarily for Vocaloid content.
By default, atwiki is used as the source.
We plan to make other sources selectable, but that is not currently possible."""

[dependencies]
reqwest = "0.12.12"
scraper = "0.22.0"
tokio = { version = "1.43.0", optional = true, features = ["full"] }
urlencoding = "2.1.3"

[features]
default = ["atwiki", "async"]
atwiki = []
async = ["tokio"]
